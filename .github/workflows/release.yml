name: Release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

jobs:
    release:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-15
                      args: --target universal-apple-darwin --bundles dmg
                      uploadPlainBinary: false
                    - platform: ubuntu-22.04
                      args: --bundles appimage
                      uploadPlainBinary: false
                    - platform: windows-latest
                      args: --bundles nsis
                      uploadPlainBinary: true

        runs-on: ${{ matrix.platform }}

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Select Xcode 16.4
              if: matrix.platform == 'macos-15'
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: "16.4"

            - name: Verify macOS SDK
              if: matrix.platform == 'macos-15'
              run: |
                  xcodebuild -version
                  test "$(xcrun --sdk macosx --show-sdk-version)" = "15.5"

            - name: Install frontend dependencies
              run: npm ci

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Install Tauri CLI
              run: cargo install tauri-cli --version 2.11.3 --locked

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    build-essential \
                    curl \
                    wget \
                    file \
                    libssl-dev

            - name: Build and publish Tauri app
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tauriScript: cargo tauri
                  tagName: v__VERSION__
                  releaseName: SolonCode Studio v__VERSION__
                  releaseBody: update v__VERSION__
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}
                  uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
